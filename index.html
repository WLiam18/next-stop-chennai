<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183c35">
  <meta name="description" content="Follow your Chennai MTC bus and get a chime before your stop.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./mark.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=3">
  <title>Next Stop Chennai</title>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="./" aria-label="Next Stop Chennai home">
        <img src="./mark.svg?v=3" class="brand-icon" width="36" height="36" alt="">
        <span class="brand-name">Next Stop<span class="brand-dot">.</span></span>
        <span class="brand-city"><span lang="ta">சென்னை</span>Chennai</span>
      </a>
      <button id="saved-open" class="button nav-button" type="button"><span data-icon="bookmark"></span> Saved rides</button>
    </div>
  </header>

  <main class="wrap">
    <section id="next-panel" class="ticket" aria-labelledby="next-name">
      <div class="ticket-board">
        <div class="ticket-status">
          <span class="ticket-route"><span data-icon="bus"></span><span id="ticket-code">MTC</span></span>
          <span id="mode">Preview</span>
        </div>
        <div class="ticket-stop">
          <p id="next-label">Bound for</p>
          <h1 id="next-name" aria-live="polite" aria-atomic="true">Your bus</h1>
          <p class="ticket-detail"><span id="ticket-origin"></span><span id="next-distance"></span></p>
        </div>
        <div class="ticket-bottom">
          <button id="demo" class="demo-button" type="button" disabled><span data-icon="play"></span><span id="demo-label">Try a demo ride</span></button>
          <span id="ticket-progress" hidden></span>
        </div>
      </div>
      <div class="ticket-art">
        <div class="madras-scene" aria-hidden="true">

        <ellipse rx="19" ry="23" fill="#273430" stroke="#51615a" stroke-width="1"/>
        <ellipse rx="12.2" ry="16.1" fill="#a3a294" stroke="#172825" stroke-width="1.6"/>
        <g class="madras-hub">
          <ellipse rx="8.1" ry="10.9" fill="#57635b"/>
          <g fill="#bbbaaa"><circle cx="0" cy="-8" r="1.6"/><circle cx="6" cy="-3" r="1.5"/><circle cx="4" cy="6" r="1.5"/><circle cx="-4" cy="6" r="1.5"/><circle cx="-6" cy="-3" r="1.5"/></g>

          <path d="m126 249 26-2m61-6 242-17" stroke="#563e30" stroke-width="2.2"/>

          <path d="M119 238h7v7l-8 1" fill="#f3bc60" stroke="#68462f" stroke-width="1"/>

          <g clip-path="url(#madras-window-band)">
            <path d="M131 133l349-17v52l-348 23z" fill="#385653"/>
            <path d="M130 148q56 8 109-7 44-13 97-5t152-11v55H126z" fill="#6c8780" opacity=".67"/>

              <circle cx="158" cy="159" r="5"/><circle cx="227" cy="154" r="5"/><circle cx="323" cy="151" r="5"/><circle cx="402" cy="147" r="5"/>
            </g>
            <path d="m129 156 353-17" stroke="#2e413b" stroke-width="1.8"/>
          </g>
          <g fill="#dac69c" stroke="#3d4a3f" stroke-width="1">
            <path d="m134 133 4-.2-1 51-5 .5zm37-2 5-.3v51l-5 .5zm41-2 5-.3v50.5l-5 .4zm43-2 5-.3v50l-5 .5zm44-2 5-.3v49.8l-5 .4zm45-2 5-.3v49l-5 .5zm45-2 5-.3v48.5l-5 .4zm42-2 5-.3v48l-5 .4zm40-2 5-.3v47l-5 .5z"/>
          </g>
          <path d="m138 135 338-15m-341 65 339-21" stroke="#d2ba8b" stroke-width="1.4"/>

          <g clip-path="url(#madras-windshield)">
            <path d="m528 154q33 4 71-13l10 39-80 2z" fill="#738b80"/>

            <text x="0" y="8.7" font-size="5.2" letter-spacing=".9" font-family="system-ui,sans-serif" font-weight="700">CHENNAI CITY BUS</text>

          <path d="M153 251q1-34 27-36 26-1 29 33m247-18q2-36 27-37 26-2 29 32" fill="none" stroke="#d18a58" stroke-width="2.6"/>

    </g>
  </svg>
</div>

      </div>
      <div class="ride-meter" aria-hidden="true"><i></i></div>
    </section>
    <div class="layout">
      <section class="setup" aria-labelledby="ride-title">
        <div class="setup-head"><h2 id="ride-title">Your ride</h2>
          <button id="favorite" class="button icon-button favorite" type="button" aria-label="Save ride" title="Save ride" disabled><span data-icon="bookmark"></span></button>
        </div>
        <div class="fields">
          <div class="field">
            <span class="field-label" id="route-field-label">Bus route</span>
            <button id="change-route" class="field-button" type="button" aria-labelledby="route-field-label route-number route-title route-origin" disabled>
              <span id="route-number" class="route-badge">—</span>
              <span class="field-text"><strong id="route-title">Loading routes…</strong><span id="route-origin"></span></span>
              <span class="field-chevron" data-icon="chevron"></span>
            </button>
          </div>
          <div class="field">
            <span class="field-label" id="alert-field-label">Get off at</span>
            <button id="destination-open" class="field-button" type="button" aria-labelledby="alert-field-label destination-label" disabled>
              <span class="field-icon" data-icon="bell"></span>
              <span class="field-text"><strong id="destination-label">Choose a stop</strong></span>
              <span class="field-chevron" data-icon="chevron"></span>
            </button>
            <p id="alert-detail" class="alert-detail" hidden></p>
          </div>
        </div>

        <div class="ride-actions">
          <button id="track" class="button primary" type="button" disabled><span data-icon="locate"></span><span id="track-label">Start tracking</span></button>
        </div>
        <p id="gps-status" class="hint"><span data-icon="info"></span><span id="gps-copy" role="status">Keep this screen open and awake for stop alerts.</span></p>
      </section>

      <section class="overview" aria-labelledby="stops-title">
        <div class="overview-head">
          <div class="overview-title">
            <h2 id="stops-title">Along the route</h2>
            <p><span id="stop-count">—</span></p>
          </div>
          <div class="view-switch" role="group" aria-label="Route view">
            <button id="map-view" type="button" aria-pressed="true" aria-controls="map-panel">Map</button>
            <button id="stops-view" type="button" aria-pressed="false" aria-controls="stops-panel">Stops</button>
          </div>
        </div>

        <div id="map-panel" class="map-panel">
          <canvas id="route-map" role="img" aria-label="Map of the selected bus route"></canvas>
          <div class="map-tools" aria-label="Map controls">
            <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in" data-icon="plus" disabled></button>
            <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out" data-icon="minus" disabled></button>
            <button id="fit-route" type="button" aria-label="Fit full route" title="Fit full route" data-icon="expand" disabled></button>
          </div>
          <a class="map-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
        </div>

        <div id="stops-panel" class="stops-panel" hidden>
          <p id="stops-subtitle" class="stops-summary">Stops in travel order</p>
          <ol id="timeline" class="timeline" aria-label="Bus stops"></ol>
          <button id="show-stops" class="button all-stops" type="button" hidden><span id="show-label">Show all stops</span><span data-icon="down"></span></button>
        </div>
      </section>
    </div>

    <footer class="footer">
      <p>Your location stays on this device.</p>
      <div>
        <button id="install-open" class="text-button" type="button">Add to Home Screen</button>
        <a id="data-source" href="https://github.com/reclaimchennai/India_GTFS" target="_blank" rel="noopener">Route data <span data-icon="external"></span></a>
      </div>
    </footer>
  </main>

  <dialog id="panel" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
    <div class="dialog-head"><div><h2 id="dialog-title"></h2><p id="dialog-copy"></p></div><button class="button icon-button close-button" id="close-panel" type="button" aria-label="Close"><span data-icon="close"></span></button></div>
    <div id="panel-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <section id="arrival" class="arrival" role="alert" hidden><span class="arrival-icon" data-icon="bell"></span><div><strong id="arrival-title"></strong><p id="arrival-text"></p></div><button class="button icon-button close-button" id="dismiss-arrival" type="button" aria-label="Dismiss alert"><span data-icon="close"></span></button></section>
  <script type="module" src="./app.mjs?v=3"></script>
</body>
</html>
